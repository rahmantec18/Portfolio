<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="jjkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020108"/>
      <stop offset="50%" stop-color="#080318"/>
      <stop offset="100%" stop-color="#020105"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb00ff"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
