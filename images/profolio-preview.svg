<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#090d24"/>
      <stop offset="100%" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.1" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="250" r="180" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="900" cy="500" r="220" fill="#8b5cf6" opacity="0.06" filter="url(#glow)"/>

  <!-- Top App Header Mock -->
  <rect x="120" y="80" width="960" height="60" rx="12" fill="#0d142b" stroke="#1e294f" stroke-width="1"/>
  <circle cx="155" cy="110" r="6" fill="#ef4444"/>
  <circle cx="175" cy="110" r="6" fill="#f59e0b"/>
  <circle cx="195" cy="110" r="6" fill="#10b981"/>
  <rect x="230" y="98" width="400" height="24" rx="6" fill="#152042"/>
  <text x="250" y="115" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">https://rahmantec18.github.io/rahmantec18-profolio/</text>

  <!-- Hero Content Mockup -->
  <text x="160" y="240" font-family="'Sora', sans-serif" font-weight="800" font-size="44" fill="#ffffff">PROFOLIO</text>
  <text x="160" y="280" font-family="'Sora', sans-serif" font-weight="600" font-size="20" fill="url(#cyanGrad)">NEXT-GEN WEB DEVELOPMENT &amp; PORTFOLIO PLATFORM</text>
  <text x="160" y="325" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8">Bespoke portfolio engineering for developers, creators, and modern agencies.</text>

  <!-- Card Docks -->
  <rect x="160" y="380" width="260" height="260" rx="16" fill="#0c1328" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="180" y="410" width="48" height="48" rx="10" fill="#00f2fe" opacity="0.15"/>
  <text x="195" y="440" font-family="'Sora', sans-serif" font-weight="bold" font-size="20" fill="#00f2fe">&lt;/&gt;</text>
  <text x="180" y="490" font-family="'Sora', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Web Engineering</text>
  <text x="180" y="525" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Ultra-fast responsive interfaces with 60fps animations and fluid interactivity.</text>
  <rect x="180" y="575" width="110" height="28" rx="6" fill="#1e293b"/>
  <text x="195" y="594" font-family="'Inter', sans-serif" font-size="11" fill="#00f2fe">VITE + REACT</text>

  <rect x="460" y="380" width="260" height="260" rx="16" fill="#0c1328" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="480" y="410" width="48" height="48" rx="10" fill="#8b5cf6" opacity="0.15"/>
  <text x="495" y="440" font-family="'Sora', sans-serif" font-weight="bold" font-size="20" fill="#8b5cf6">★</text>
  <text x="480" y="490" font-family="'Sora', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Design Identity</text>
  <text x="480" y="525" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Cohesive visual design systems, dark modes, and high-impact typography.</text>
  <rect x="480" y="575" width="110" height="28" rx="6" fill="#1e293b"/>
  <text x="495" y="594" font-family="'Inter', sans-serif" font-size="11" fill="#8b5cf6">TAILWIND CSS</text>

  <rect x="760" y="380" width="260" height="260" rx="16" fill="#0c1328" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="780" y="410" width="48" height="48" rx="10" fill="#3b82f6" opacity="0.15"/>
  <text x="795" y="440" font-family="'Sora', sans-serif" font-weight="bold" font-size="20" fill="#3b82f6">⚡</text>
  <text x="780" y="490" font-family="'Sora', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Global Hosting</text>
  <text x="780" y="525" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Seamless zero-downtime deployment pipelines with GitHub Pages and Render.</text>
  <rect x="780" y="575" width="120" height="28" rx="6" fill="#1e293b"/>
  <text x="795" y="594" font-family="'Inter', sans-serif" font-size="11" fill="#3b82f6">GITHUB PAGES</text>
</svg>
