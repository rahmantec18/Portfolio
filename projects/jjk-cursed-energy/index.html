<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Kaisen: Cursed Energy — Abdur Rahman I</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛩️</text></svg>" />
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Courier New', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
    
        #ui {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }
        
        h1 { 
            font-size: clamp(2rem, 5vw, 3.5rem); 
            margin: 0; 
            letter-spacing: 12px; 
            font-weight: 900; 
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        #subtitle {
            font-size: 0.75rem;
            letter-spacing: 6px;
            color: #888;
            margin-top: 4px;
            text-transform: uppercase;
        }

        #technique-name { 
            font-size: clamp(1rem, 2.5vw, 1.35rem); 
            color: #00ffff; 
            margin-top: 14px; 
            font-weight: bold; 
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
            transition: all 0.3s ease;
        }

        /* Interactive Technique Switcher (Clickable on any device) */
        #controls-bar {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            z-index: 25;
            background: rgba(10, 10, 20, 0.75);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .tech-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        .tech-btn:hover {
            color: #fff;
            transform: translateY(-1px);
        }

        .tech-btn.active {
            color: #fff;
            border-color: currentColor;
            box-shadow: 0 0 15px currentColor;
        }

        .tech-btn[data-tech="neutral"].active { color: #00ffff; }
        .tech-btn[data-tech="red"].active { color: #ff3333; }
        .tech-btn[data-tech="void"].active { color: #00ffff; }
        .tech-btn[data-tech="purple"].active { color: #bb00ff; }
        .tech-btn[data-tech="shrine"].active { color: #ff2222; }

        /* Gesture Cheat-Sheet Guide */
        #gesture-hint {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #777;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Large Centered Camera Hub - Taller for Reel Context */
        #video-container {
            position: absolute;
            bottom: 3%;
            left: 18%;
            transform: translateX(-50%) scaleX(-1);
            width: 85vw;
            max-width: 360px;
            height: 32vh; 
            border: 2px solid rgba(255, 255, 255, 0.25);
            z-index: 20;
            background-color: #050508; 
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            transition: border-color 0.3s ease;
        }

        @media (max-width: 768px) {
            #video-container {
                left: 50%;
                bottom: 2%;
                height: 25vh;
                max-width: 280px;
            }
            #controls-bar {
                top: 22%;
                width: 90%;
            }
        }

        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* Back to Portfolio Button */
        #back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 30;
            color: #00ffff;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        #back-link:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="grain"></div>

    <a id="back-link" href="../../#projects">← PORTFOLIO</a>

    <div id="ui">
        <h1>呪術廻戦</h1>
        <div id="subtitle">JUJUTSU KAISEN // EXCLUSIVE 3D WEBMCP EXP</div>
        <div id="technique-name">CURSED ENERGY</div>
    </div>

    <!-- Manual or Fallback Technique Control Bar -->
    <div id="controls-bar">
        <button class="tech-btn active" data-tech="neutral">NEUTRAL</button>
        <button class="tech-btn" data-tech="red">RED 🔴</button>
        <button class="tech-btn" data-tech="void">INFINITE VOID 🔵</button>
        <button class="tech-btn" data-tech="purple">HOLLOW PURPLE 🟣</button>
        <button class="tech-btn" data-tech="shrine">MALEVOLENT SHRINE ⛩️</button>
    </div>

    <div id="gesture-hint">
        HAND GESTURES: PINCH = PURPLE | 4 FINGERS UP = SHRINE | 2 FINGERS UP = VOID | 1 FINGER UP = RED
    </div>

    <div id="video-container">
        <video class="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- Scene & Rendering ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 55;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    composer.addPass(bloomPass);

    const COUNT = 20000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);
    
    const targetPositions = new Float32Array(COUNT * 3);
    const targetColors = new Float32Array(COUNT * 3);
    const targetSizes = new Float32Array(COUNT);

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    scene.add(particles);

    // Technique Functions 
    function getRed(i) {
        if(i < COUNT * 0.1) {
            const r = Math.random() * 9;
            const theta = Math.random() * 6.28; const phi = Math.acos(2 * Math.random() - 1);
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 3, g: 0.1, b: 0.1, s: 2.5 };
        } else {
            const armCount = 3; const t = (i / COUNT); 
            const angle = t * 15 + ((i % armCount) * (Math.PI * 2 / armCount));
            const radius = 2 + (t * 40); 
            return { x: radius * Math.cos(angle), y: radius * Math.sin(angle), z: (Math.random() - 0.5) * (10 * t), r: 0.8, g: 0, b: 0, s: 1.0 };
        }
    }

    function getVoid(i) {
        if (i < COUNT * 0.15) {
            const angle = Math.random() * Math.PI * 2;
            return { x: 26 * Math.cos(angle), y: 26 * Math.sin(angle), z: (Math.random()-0.5) * 1, r: 1, g: 1, b: 1, s: 2.5 };
        } else {
            const radius = 30 + Math.random() * 90;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 0.1, g: 0.6, b: 1.0, s: 0.7 };
        }
    }

    function getPurple(i) {
        if (Math.random() > 0.8) return { x: (Math.random() - 0.5) * 100, y: (Math.random() - 0.5) * 100, z: (Math.random() - 0.5) * 100, r: 0.5, g: 0.5, b: 0.7, s: 0.8 };
        const r = 20; const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
        return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 0.6, g: 0.5, b: 1.0, s: 2.5 };
    }

    function getShrine(i) {
        const total = COUNT;
        if (i < total * 0.3) return { x: (Math.random()-0.5)*80, y: -15, z: (Math.random()-0.5)*80, r: 0.4, g: 0, b: 0, s: 0.8 };
        else if (i < total * 0.4) {
            const px = ((i%4)<2?1:-1)*12; const pz = ((i%4)%2==0?1:-1)*8;
            return { x: px+(Math.random()-0.5)*2, y: -15+Math.random()*30, z: pz+(Math.random()-0.5)*2, r: 0.2, g: 0.2, b: 0.2, s: 0.6 };
        } else if (i < total * 0.6) {
            const t = Math.random() * Math.PI * 2; const rad = Math.random() * 30;
            const curve = Math.pow(rad/30, 2) * 10; 
            return { x: rad*Math.cos(t), y: 15 - curve + (Math.random()*2), z: rad*Math.sin(t)*0.6, r: 0.6, g: 0, b: 0, s: 0.6 };
        } else return { x: 0, y: 0, z: 0, r: 0, g: 0, b: 0, s: 0 };
    }

    // Hand Tracking & State
    let currentTech = 'neutral';
    let shakeIntensity = 0;
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const videoContainer = document.getElementById('video-container');
    let glowColor = '#00ffff';

    window.updateState = function(tech) {
        if(currentTech === tech) return;
        currentTech = tech;
        const nameEl = document.getElementById('technique-name');
        shakeIntensity = tech !== 'neutral' ? 0.4 : 0;

        // Update active button state
        document.querySelectorAll('.tech-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-tech') === tech);
        });

        if(tech === 'shrine') { 
            glowColor = '#ff0000'; 
            nameEl.innerText = "Domain Expansion: Malevolent Shrine"; 
            nameEl.style.color = '#ff2222';
            nameEl.style.textShadow = '0 0 20px rgba(255, 34, 34, 0.8)';
            bloomPass.strength = 2.5; 
            if(videoContainer) videoContainer.style.borderColor = 'rgba(255, 34, 34, 0.8)';
        }
        else if(tech === 'purple') { 
            glowColor = '#bb00ff'; 
            nameEl.innerText = "Secret Technique: Hollow Purple"; 
            nameEl.style.color = '#bb00ff';
            nameEl.style.textShadow = '0 0 20px rgba(187, 0, 255, 0.8)';
            bloomPass.strength = 4.0; 
            if(videoContainer) videoContainer.style.borderColor = 'rgba(187, 0, 255, 0.8)';
        }
        else if(tech === 'void') { 
            glowColor = '#00ffff'; 
            nameEl.innerText = "Domain Expansion: Infinite Void"; 
            nameEl.style.color = '#00ffff';
            nameEl.style.textShadow = '0 0 20px rgba(0, 255, 255, 0.8)';
            bloomPass.strength = 2.0; 
            if(videoContainer) videoContainer.style.borderColor = 'rgba(0, 255, 255, 0.8)';
        }
        else if(tech === 'red') { 
            glowColor = '#ff3333'; 
            nameEl.innerText = "Reverse Cursed Technique: Red"; 
            nameEl.style.color = '#ff3333';
            nameEl.style.textShadow = '0 0 20px rgba(255, 51, 51, 0.8)';
            bloomPass.strength = 2.5; 
            if(videoContainer) videoContainer.style.borderColor = 'rgba(255, 51, 51, 0.8)';
        }
        else { 
            glowColor = '#00ffff'; 
            nameEl.innerText = "Neutral State"; 
            nameEl.style.color = '#00ffff';
            nameEl.style.textShadow = '0 0 15px rgba(0, 255, 255, 0.7)';
            bloomPass.strength = 1.0; 
            if(videoContainer) videoContainer.style.borderColor = 'rgba(255, 255, 255, 0.25)';
        }

        for(let i=0; i<COUNT; i++) {
            let p;
            if(tech === 'neutral') {
                if(i < COUNT * 0.05) {
                    const r = 15 + Math.random()*20; const t = Math.random()*6.28; const ph = Math.random()*3.14;
                    p = { x: r*Math.sin(ph)*Math.cos(t), y: r*Math.sin(ph)*Math.sin(t), z: r*Math.cos(ph), r: 0.1, g: 0.1, b: 0.2, s: 0.4 };
                } else p = { x:0, y:0, z:0, r:0, g:0, b:0, s:0 };
            }
            else if(tech === 'red') p = getRed(i);
            else if(tech === 'void') p = getVoid(i);
            else if(tech === 'purple') p = getPurple(i);
            else if(tech === 'shrine') p = getShrine(i);
            
            targetPositions[i*3] = p.x; targetPositions[i*3+1] = p.y; targetPositions[i*3+2] = p.z;
            targetColors[i*3] = p.r; targetColors[i*3+1] = p.g; targetColors[i*3+2] = p.b;
            targetSizes[i] = p.s;
        }
    }

    // Attach click listeners to controls bar
    document.querySelectorAll('.tech-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tech = btn.getAttribute('data-tech');
            window.updateState(tech);
        });
    });

    // Initialize MediaPipe Hands
    try {
        if (typeof Hands !== 'undefined') {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7 });

            hands.onResults((results) => {
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                let detected = 'neutral';

                if (results.multiHandLandmarks) {
                    results.multiHandLandmarks.forEach((lm) => {
                        drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {color: glowColor, lineWidth: 5});
                        drawLandmarks(canvasCtx, lm, {color: '#fff', lineWidth: 1, radius: 2});

                        const isUp = (t, p) => lm[t].y < lm[p].y;
                        const pinch = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
                        
                        if (pinch < 0.04) detected = 'purple';
                        else if (isUp(8,6) && isUp(12,10) && isUp(16,14) && isUp(20,18)) detected = 'shrine';
                        else if (isUp(8,6) && isUp(12,10) && !isUp(16,14)) detected = 'void';
                        else if (isUp(8,6) && !isUp(12,10)) detected = 'red';
                    });
                }
                window.updateState(detected);
            });

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof Camera !== 'undefined') {
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        canvasElement.width = videoElement.videoWidth || 640;
                        canvasElement.height = videoElement.videoHeight || 480;
                        await hands.send({image: videoElement});
                    }, width: 640, height: 480
                });
                cameraUtils.start().catch((err) => {
                    console.warn("Camera access optional or not granted. Use on-screen technique buttons!", err);
                });
            }
        }
    } catch (e) {
        console.warn("MediaPipe initializing error:", e);
    }

    // Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        
        if (shakeIntensity > 0) {
            renderer.domElement.style.transform = `translate(${(Math.random()-0.5)*shakeIntensity*40}px, ${(Math.random()-0.5)*shakeIntensity*40}px)`;
        } else {
            renderer.domElement.style.transform = 'translate(0,0)';
        }

        const pos = particles.geometry.attributes.position.array;
        const col = particles.geometry.attributes.color.array;
        const siz = particles.geometry.attributes.size.array;

        for(let i=0; i<COUNT*3; i++) {
            pos[i] += (targetPositions[i] - pos[i]) * 0.1;
            col[i] += (targetColors[i] - col[i]) * 0.1;
        }
        for(let i=0; i<COUNT; i++) siz[i] += (targetSizes[i] - siz[i]) * 0.1;

        particles.geometry.attributes.position.needsUpdate = true;
        particles.geometry.attributes.color.needsUpdate = true;
        particles.geometry.attributes.size.needsUpdate = true;
        
        // ROTATION LOGIC: Locking rotation for Shrine
        if(currentTech === 'red') {
            particles.rotation.z -= 0.1;
        } else if (currentTech === 'purple') {
            particles.rotation.z += 0.2; 
            particles.rotation.y += 0.05;
        } else if (currentTech === 'shrine') {
            // FORCE UPRIGHT: Reset and freeze all rotations
            particles.rotation.set(0, 0, 0); 
        } else {
            // Default Neutral rotation
            particles.rotation.y += 0.005;
        }

        composer.render();
    }
    animate();

    // Fixed typo in resize listener
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
