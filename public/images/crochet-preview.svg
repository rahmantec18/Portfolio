<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="crochetBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140714"/>
      <stop offset="50%" stop-color="#240c21"/>
      <stop offset="100%" stop-color="#0a0309"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#crochetBg)"/>

  <!-- Top App Header Mock -->
  <rect x="120" y="80" width="960" height="60" rx="12" fill="#2b0e27" stroke="#4a1843" stroke-width="1"/>
  <circle cx="155" cy="110" r="6" fill="#ef4444"/>
  <circle cx="175" cy="110" r="6" fill="#f59e0b"/>
  <circle cx="195" cy="110" r="6" fill="#10b981"/>
  <rect x="230" y="98" width="400" height="24" rx="6" fill="#381333"/>
  <text x="250" y="115" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f472b6">https://crochethouseofswats.lovable.app</text>

  <!-- Title & Visual Showcase -->
  <text x="160" y="230" font-family="'Cinzel', serif" font-weight="700" font-size="44" fill="#fdf2f8">CROCHET HOUSE OF SWATS</text>
  <text x="160" y="275" font-family="'Sora', sans-serif" font-weight="600" font-size="20" fill="url(#pinkGrad)">ARTISANAL HANDMADE FIBER ART &amp; BESPOKE CREATIONS</text>
  <text x="160" y="320" font-family="'Inter', sans-serif" font-size="16" fill="#e9d5ff">An intimate digital showcase blending organic tactile craft with modern interactive e-commerce aesthetics.</text>

  <!-- Product Mockup Cards -->
  <g transform="translate(160, 370)">
    <rect width="260" height="270" rx="18" fill="#200d20" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="130" cy="100" r="65" fill="#f43f5e" opacity="0.15"/>
    <text x="130" y="108" text-anchor="middle" font-family="'Cinzel', serif" font-size="24" fill="#f472b6">🧶 PLUSH</text>
    <text x="30" y="200" font-family="'Sora', sans-serif" font-weight="700" font-size="18" fill="#ffffff">Amigurumi Charms</text>
    <text x="30" y="228" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Delicately spun characters crafted with velvet yarn.</text>
  </g>

  <g transform="translate(460, 370)">
    <rect width="260" height="270" rx="18" fill="#200d20" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="130" cy="100" r="65" fill="#c084fc" opacity="0.15"/>
    <text x="130" y="108" text-anchor="middle" font-family="'Cinzel', serif" font-size="24" fill="#c084fc">🌸 FLORA</text>
    <text x="30" y="200" font-family="'Sora', sans-serif" font-weight="700" font-size="18" fill="#ffffff">Everlasting Bouquets</text>
    <text x="30" y="228" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Handcrafted botanical blooms that never fade.</text>
  </g>

  <g transform="translate(760, 370)">
    <rect width="260" height="270" rx="18" fill="#200d20" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="130" cy="100" r="65" fill="#ec4899" opacity="0.15"/>
    <text x="130" y="108" text-anchor="middle" font-family="'Cinzel', serif" font-size="24" fill="#ec4899">👜 WEAR</text>
    <text x="30" y="200" font-family="'Sora', sans-serif" font-weight="700" font-size="18" fill="#ffffff">Boho Crochet Bags</text>
    <text x="30" y="228" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Textured statement totes engineered for everyday grace.</text>
  </g>
</svg>
